<html>

<body>

<h1>EMC問題集</h1>

<div id="question"></div>

<script>

var questions = [
{
q:"自由空間を伝搬する周波数60MHzの電磁波について、波長として正しいものは？",
choices:["5m","0.2m","5000m","50m"],
answer:0,
exp:"波長＝3×10⁸÷(60×10⁶)=5m"
},

{
q:"微小ダイポールと微小ループの近傍界について正しいものは？",
choices:[
"微小ダイポールでは磁界が優勢",
"微小ループでは電界が優勢",
"微小ダイポールでは電界、微小ループでは磁界が優勢",
"周波数だけで決まる"
],
answer:2,
exp:"微小ダイポールでは電界、微小ループでは磁界が優勢。"
},

{
q:"30MHzの微小放射源の近傍界と遠方界の境界距離は？",
choices:["10m","1.6m","3.2m","5.0m"],
answer:1,
exp:"波長10m、境界距離=10/(2π)≒1.6m"
},

{
q:"放射電力10W、距離10mの等方性アンテナの電界強度は？",
choices:["1.73V/m","30V/m","17.3V/m","0.173V/m"],
answer:0,
exp:"E=√(30P)/d=√300/10=1.73V/m"
},

{
q:"2mV/mをdBμV/mへ換算すると？",
choices:[
"33dBμV/m",
"6dBμV/m",
"66dBμV/m",
"46dBμV/m"
],
answer:2,
exp:"2mV/m=2000μV/m、20log10(2000)=66dBμV/m"
},

{
q:"遠方界の平面波に関する正しい説明は？",
choices:[
"電界と磁界は進行方向に平行",
"電界だけ進行方向に平行",
"電界と磁界は互いに直交し進行方向にも直交",
"電界と磁界は平行"
],
answer:2,
exp:"遠方界では電界・磁界・進行方向は互いに直交する。"
},

{
q:"アンテナ利得と指向性の関係で誤っているものは？",
choices:[
"損失が増えると利得は低下する",
"利得は指向性と放射効率に関係する",
"放射効率が低くても利得は指向性より大きくなる",
"損失が無ければ利得と指向性は一致する"
],
answer:2,
exp:"利得は放射効率を超えないため指向性より大きくならない。"
},

{
q:"半波長ダイポールの共振状態について誤っているものは？",
choices:[
"給電点リアクタンスを大きくする",
"リアクタンスはほぼゼロ",
"効率よく放射する",
"入力インピーダンスは抵抗性に近い"
],
answer:0,
exp:"共振時はリアクタンスがほぼゼロになる。"
},

{
q:"50Ω線路に150Ω負荷を接続した場合の反射係数は？",
choices:[
"0.50",
"0.67",
"3.00",
"0.33"
],
answer:0,
exp:"|(150-50)/(150+50)|=0.50"
},

{
q:"反射係数0.2のVSWRは？",
choices:[
"0.67",
"1.2",
"5.0",
"1.5"
],
answer:3,
exp:"(1+0.2)/(1-0.2)=1.5"
}
];

document.getElementById("question").innerHTML =
questions[0].q;

</script>
